<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef4e8" />
    <title>Country Project Game</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="game-shell">
      <div id="game"></div>
      <p class="hint">矢印キー / WASD、または画面のボタンで歩けます</p>
    </main>

    <script>
      window.addEventListener('error', (event) => {
        console.error('Game error:', event.error || event.message);
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="./src/main.js"></script>
    <script src="./src/app-shell.js"></script>
    <script src="./src/mobile-controls.js"></script>
  </body>
</html>
